# fly.toml app configuration file generated for ps5-2-devs on 2026-11-09T16:56:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ps5-2-devs'
primary_region = 'lax'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
